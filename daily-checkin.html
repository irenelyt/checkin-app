<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双计划打卡台 · 减重20斤 + OET词汇</title>
<meta name="theme-color" content="#ff7a45">
<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--p:#ff7a45;--p2:#2f9e8f;--bg:#f6f7f9;--card:#fff;--txt:#26313d;--sub:#8a97a5;--line:#e8ecf0;--ok:#22b07d;}
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
body{background:var(--bg);color:var(--txt);padding-bottom:60px;}
header{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#ff7a45,#ff9a5c);color:#fff;padding:14px 16px 12px;box-shadow:0 2px 10px rgba(255,122,69,.3);}
header h1{font-size:18px;display:flex;justify-content:space-between;align-items:center;}
.countdown{font-size:12px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px;}
.tabs{display:flex;margin:12px 16px 0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.tab{flex:1;text-align:center;padding:11px 0;font-size:14px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;}
.tab.on{color:var(--p);border-color:var(--p);font-weight:600;}
.datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 16px;}
.datebar button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:15px;cursor:pointer;color:var(--txt);}
.datebar .d{font-size:15px;font-weight:600;min-width:150px;text-align:center;}
.datebar .d small{display:block;font-size:11px;color:var(--sub);font-weight:400;}
main{padding:0 16px;}
.card{background:var(--card);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.card h3{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef3f2;color:var(--p2);}
.badge.done{background:#e3f7ee;color:var(--ok);}
input[type=number],input[type=text]{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;width:100%;outline:none;}
input:focus{border-color:var(--p);}
button.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;background:var(--p);color:#fff;width:100%;}
button.btn.green{background:var(--p2);}
button.btn.ghost{background:#fff;color:var(--sub);border:1px solid var(--line);}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.meal{border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center;}
.meal .t{font-size:12px;color:var(--sub);margin-bottom:6px;}
.meal .ph{height:64px;border-radius:8px;background:#f2f4f6;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;overflow:hidden;color:#c3ccd4;}
.meal .ph img{width:100%;height:100%;object-fit:cover;}
.meal input{margin-top:6px;text-align:center;font-size:11px;padding:4px;}
.checkrow{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px;}
.checkrow input{width:19px;height:19px;accent-color:var(--p);}
.hint{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6;}
.wordcard{background:linear-gradient(135deg,#fff,#f0fbf8);border:1px solid #d8efe9;}
.wordcard .dayn{font-size:26px;font-weight:700;color:var(--p2);}
.wordmeta{font-size:13px;color:var(--sub);line-height:1.9;margin:8px 0;}
.wordmeta b{color:var(--txt);}
.bigbtn{margin-top:10px;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat{background:#fff;border-radius:12px;padding:13px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.stat .v{font-size:20px;font-weight:700;color:var(--p);}
.stat.g .v{color:var(--p2);}
.stat .k{font-size:11px;color:var(--sub);margin-top:3px;}
canvas{width:100%;}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:6px;}
.heat i{aspect-ratio:1;border-radius:3px;background:#edf0f3;}
.heat i.ex{background:#ffb08f;}
.heat i.wd{background:#8fd8c8;}
.heat i.b{background:linear-gradient(135deg,#ffb08f,#8fd8c8);}
.alert.miss{background:#ffe3e3;color:#b03030;}
.wpriv{filter:blur(9px);user-select:none;transition:filter .2s;}
.leg{font-size:10px;color:var(--sub);margin-top:6px;display:flex;gap:12px;}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px;}
.empty{padding:40px 0;text-align:center;color:var(--sub);font-size:13px;}
.streak{font-size:12px;color:var(--p);font-weight:600;}
.alert{font-size:12px;padding:8px 10px;border-radius:9px;margin-bottom:12px;}
.alert.warn{background:#fff4e8;color:#c2620a;}
.alert.info{background:#e8f4f2;color:#20776b;}
</style>
</head>

// ---------- storage ----------
function load(k,def){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;} }
function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){alert("存储空间已满，请删除部分旧照片数据");} }
const ck = d => "ds_ck_"+d, wk = d => "ds_w_"+d, gtk = d => "ds_g_"+d;

// ---------- streak ----------
function streak(fn){ let n=0,d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<400;i++){ const s=fmt(d); if(fn(s)){n++;} else if(i>0||s!==cur){break;} d.setDate(d.getDate()-1);} return n; }

// ---------- photo compress ----------
function compress(file,cb){ const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    const c=document.createElement("canvas");const mx=200;let w=img.width,h=img.height;
    if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}
    c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    cb(c.toDataURL("image/jpeg",.5));};img.src=e.target.result;};
  r.readAsDataURL(file); }

// ---------- tabs ----------
let tab="fit";
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); tab=t.dataset.t; render(); });
$("#prev").onclick=()=>{cur=dateOf(Math.max(1,(dayN(cur)||1)-1))||shift(cur,-1);render();};
$("#next").onclick=()=>{cur=shift(cur,1);render();};
function shift(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);}

function render(){
  const dt=parse(cur);
  $("#dstr").textContent = (dt.getMonth()+1)+"月"+dt.getDate()+"日";
  const n=dayN(cur);
  $("#dextra").textContent = n ? ("Day "+n+" / "+totalDays) : ("计划周期外 · "+WEEKS[dt.getDay()]);
  $("#cd").textContent = "距3月1日还剩 "+Math.max(0,remaining())+" 天";
  const wHead=$("#wHead"); if(wHead) wHead.textContent = weightHidden?"· · · 斤":"154 → 134 斤";
  const wT=$("#wToggle"); if(wT){ wT.textContent = weightHidden?"🙈 显示":"👁 隐藏"; wT.title = weightHidden?"点击显示体重":"点击隐藏体重（隐私）"; }
  $("#datebar").style.display = (tab==="stat"||tab==="nz"||tab==="save") ? "none" : "flex";
  const m=$("#main");
  if(tab==="fit") m.innerHTML=fitView();
  else if(tab==="word") m.innerHTML=wordView();
  else if(tab==="nz") m.innerHTML=nzView();
  else if(tab==="save") m.innerHTML=saveView();
  else { m.innerHTML=statView(); drawChart(); }
  if(tab==="word") renderQR();
  bind();
}

// ================= 单词打卡 =================
function wordView(){
  const n=dayN(cur), st=streak(s=>load(wk(s),false));
  let wmiss="";
  const ys2=shift(cur,-1);
  if(dayN(ys2)){
    if(!load(wk(ys2),false)) wmiss+=`<div class="alert miss">🔴 昨天（Day ${dayN(ys2)}）的单词还没打卡！漏一天，记忆链就断一环～<br><button class="btn ghost" data-jump="${ys2}" style="margin-top:6px;">📅 去补背</button></div>`;
    else wmiss+=`<div class="alert info">✅ 昨天的单词打卡完成，赞！</div>`;
  }
  if(dayN(cur)&&!load(wk(cur),false)) wmiss+=`<div class="alert warn">📌 今天的单词（Day ${dayN(cur)}，24个）还没背，记得今晚完成～</div>`;
  if(n===null) h+=`<div class="empty">此日期不在背诵周期内（Day 1 = 2026年11月16日）</div>`;
  return wmiss+h;
  const done=load(wk(cur),false);
  const w1=(n-1)*PER_DAY+1, w2=Math.min(n*PER_DAY,TOTAL_WORDS);
  const c1=Math.ceil(w1/WORDS_PER_CH), c2=Math.ceil(w2/WORDS_PER_CH);
  const chap = c1===c2?`第${c1}章 · ${CHAPTERS[c1-1]}`:`第${c1}~${c2}章（${CHAPTERS[c1-1]} → ${CHAPTERS[c2-1]}）`;
  const prev = n>1?`复习 Day ${Math.max(1,n-3)} ~ Day ${n-1} 的旧词（快过一遍）`:`今天是第一天，直接开始！`;
  let h=`<div class="card wordcard"><h3>📖 OET 词汇 · 今日任务 <span class="badge ${done?"done":""}">${done?"已完成":"进行中"}</span></h3>
    <div class="dayn">Day ${n}</div>
    <div class="wordmeta">
      📚 新词：<b>${w1} ~ ${w2} 号</b>（共 ${w2-w1+1} 个）<br>
      📖 进度：<b>${chap}</b><br>
      🔁 ${prev}<br>
      ✍️ 每词三遍：听音频辨音 → 跟读 → 默写拼写
    </div>
    <a class="btn green" href="${AUDIO_URL}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;">🎧 点击听配套音频（英音慢速 / 美音快速）</a>
    <div id="qrbox" style="display:flex;justify-content:center;margin-top:12px;"></div>
    <div class="hint" style="text-align:center;">📱 微信扫上方二维码，手机上直接听<br>💻 电脑端点按钮首次需微信扫码授权，登录一次即可</div>
    <button class="btn ${done?"ghost":""}" id="worddone" style="margin-top:9px;">${done?"✅ 已打卡（点击取消）":"✅ 今天背完了，打卡！"}</button>
  </div>`;
  const lgDone=load("ds_lgc_"+cur,false);
  const dt0=parse(cur); const mon2=new Date(dt0); mon2.setDate(dt0.getDate()-((dt0.getDay()+6)%7));
  let lgcCount=0; for(let i=0;i<7;i++){const s=fmt(new Date(mon2.getTime()+i*864e5)); if(load("ds_lgc_"+s,false))lgcCount++;}
  h+=`<div class="card"><h3>🎧 新概念英语课 <span class="badge ${lgDone?"done":""}">${lgDone?"已听课":"未听课"}</span></h3>
    <div class="checkrow" style="font-size:13px;">📻 本周 <b>${lgcCount} / 4</b> 节（背单词的日子配套听一节，每周3~4次即可）</div>
    <button class="btn ${lgDone?"ghost":""}" id="lgcbtn" style="margin-top:9px;">${lgDone?"✅ 今天听过了（点击取消）":"▶️ 今天听了一节课，打卡！"}</button>
    <div class="hint">听力+辨音和背单词是绝配：先听课磨耳朵，再背当天词，效率翻倍。</div></div>
  <div style="text-align:center;font-size:12px;color:var(--sub);margin:4px 0 12px;">🔥 背单词连击 <span class="streak">${st}</span> 天</div>`;
  return h;
}

const ym = () => fmt(new Date()).slice(0,7); // 2026-11

let _saveYear = new Date().getFullYear(); // 攒钱页年份视图
let editWishId=null, editTgt=false, editAmt=false, editRecIdx=null, resetArm=0, delArm=null, delArmTs=0, lastDel=null; // 内联编辑状态
const WISH_TPL=[["🐋 观鲸船票",1800],["🏨 住宿",3000],["🧳 装备购物",1000],["🍜 美食基金",800],["🚗 当地交通",600],["🎁 纪念品",500]];
const stamp = () => { const n=new Date(); return (n.getMonth()+1)+"/"+n.getDate()+" "+pad(n.getHours())+":"+pad(n.getMinutes()); };
function prevYm(s){ const p=s.split("-").map(Number); const d=new Date(p[0],p[1]-2,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function carryIn(y){ let carry=0, m=prevYm(y); // 上月攒超部分链式滚入
  for(let i=0;i<36;i++){ const a=load("ds_save_"+m,null); if(a==null) break;
    const t=load("ds_save_target_"+m,1500); const over=Math.max(0,a+carry-t);
    if(over<=0) break; carry=+over.toFixed(2); m=prevYm(m); }
  return carry; }
function computePool(){ let total=0; // 所有月份记录的钱总和 = 心愿池
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k&&/^ds_save_\d{4}-\d{2}$/.test(k)){ const v=parseFloat(localStorage.getItem(k)); if(v>0) total+=v; } }
  return +total.toFixed(2); }
function computeAlloc(wishes, allocMap){ // 心愿池自动分配：按比例（或平均），满额顺延，已购心愿的钱视为已花掉
  const total=computePool();
  const doneSpent=wishes.filter(w=>w.done).reduce((s,w)=>s+w.price,0);
  const pool=Math.max(0,+(total-doneSpent).toFixed(2));
  const undone=wishes.filter(w=>!w.done);
  const result={};
  const give=(w,amt)=>{ const space=Math.max(0,+(w.price-(result[w.id]||0)).toFixed(2)); const g=+Math.min(amt,space).toFixed(2);
    if(g>0.004) result[w.id]=+((result[w.id]||0)+g).toFixed(2); return +(amt-g).toFixed(2); };
  const psum=undone.reduce((s,w)=>s+(allocMap[w.id]||0),0);
  let remain=pool;
  if(psum>0){ undone.forEach(w=>{ const p=allocMap[w.id]||0; if(p>0) remain=give(w, pool*p/psum); }); }
  else if(undone.length){ undone.forEach(w=>{ give(w, pool/undone.length); }); }
  let rest=undone.filter(w=>+(w.price-(result[w.id]||0)).toFixed(2)>0.01);
  for(let i=0;i<10&&remain>0.01&&rest.length;i++){
    const each=remain/rest.length; let spent=0;
    rest.forEach(w=>{ const g=give(w,each); spent=+(spent+g).toFixed(2); });
    remain=+(remain-spent).toFixed(2);
    rest=rest.filter(w=>+(w.price-(result[w.id]||0)).toFixed(2)>0.01);
  }
  return {result,total,pool,remain};
}

function drawChart(){
  const cv=$("#chart"); if(!cv)return; const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height,padL=38,padB=26,padT=14,padR=10;
  ctx.clearRect(0,0,W,H);
  const ws=[]; for(let i=0;i<=totalDays;i++){const s=dateOf(i+1),v=load(gtk(s),null);if(v!=null)ws.push({n:i+1,w:v});}
  const lo=Math.min(TARGET_W,...ws.map(x=>x.w))-2, hi=Math.max(START_W,...ws.map(x=>x.w))+2;
  const X=n=>padL+(W-padL-padR)*(n-1)/(totalDays-1);
  const Y=w=>padT+(H-padT-padB)*(hi-w)/(hi-lo);
  ctx.strokeStyle="#e8ecf0";ctx.fillStyle="#8a97a5";ctx.font="11px sans-serif";ctx.textAlign="right";
  for(let w=Math.ceil(lo/5)*5;w<=hi;w+=5){ctx.beginPath();ctx.moveTo(padL,Y(w));ctx.lineTo(W-padR,Y(w));ctx.stroke();ctx.fillText(w,padL-6,Y(w)+4);}
  // 姨妈期阴影区
  ctx.fillStyle="rgba(255,122,160,.12)";
  for(const [s,e] of PERIODS){ ctx.fillRect(X(Math.max(1,s)),padT,X(Math.min(totalDays,e))-X(Math.max(1,s)),H-padT-padB); }
  // 目标直线
  ctx.strokeStyle="#ffd8c2";ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(X(1),Y(START_W));ctx.lineTo(X(totalDays),Y(TARGET_W));ctx.stroke();ctx.setLineDash([]);
  // 预期波动曲线（含姨妈期水肿起伏）
  ctx.strokeStyle="#ff9a5c";ctx.lineWidth=1.5;ctx.beginPath();
  for(let n2=1;n2<=totalDays;n2++){const p=X(n2),q=Y(expectedW(n2));n2===1?ctx.moveTo(p,q):ctx.lineTo(p,q);}
  ctx.stroke();
  ctx.fillStyle="#ff9a5c";ctx.textAlign="left";ctx.fillText("目标曲线",X(totalDays)-64,Y(TARGET_W)-6);
  ctx.fillText("预期波动（含平台期/运动储水/姨妈期粉色区）",padL+6,Y(START_W)-4);
  // actual
  if(ws.length>0){ctx.strokeStyle="#2f9e8f";ctx.lineWidth=2.5;ctx.beginPath();
    ws.forEach((p,i)=>i?ctx.lineTo(X(p.n),Y(p.w)):ctx.moveTo(X(p.n),Y(p.w)));ctx.stroke();
    ctx.fillStyle="#2f9e8f";ws.forEach(p=>{ctx.beginPath();ctx.arc(X(p.n),Y(p.w),3.5,0,7);ctx.fill();});}
  ctx.fillStyle="#8a97a5";ctx.textAlign="center";
  ctx.fillText("11/16",X(1),H-8);ctx.fillText("3/1",X(totalDays),H-8);
}

function renderQR(){
  const el=document.getElementById("qrbox"); if(!el||!AUDIO_URL)return;
  const fallback=()=>{el.innerHTML='<img alt="音频二维码" src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data='+encodeURIComponent(AUDIO_URL)+'" width="170" height="170" style="border:8px solid #fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);">';};
  try{
    if(typeof qrcode!=="undefined"){
      const qr=qrcode(0,"M"); qr.addData(AUDIO_URL); qr.make();
      el.innerHTML=qr.createSvgTag({cellSize:3,margin:6});
      const svg=el.querySelector("svg"); if(svg){svg.style.background="#fff";svg.style.borderRadius="8px";svg.style.boxShadow="0 1px 4px rgba(0,0,0,.1)";}
      else fallback();
    } else fallback();
  }catch(e){fallback();}
}

  const tgSave=$("#tgSave"), tgCancel=$("#tgCancel");
  if(tgSave) tgSave.onclick=()=>{
    const v=parseFloat($("#tgVal").value); if(isNaN(v)||v<=0){alert("请输入正确的目标金额");return;}

  if(amtCancel) amtCancel.onclick=()=>{editAmt=false;render();};

  if(reCancel) reCancel.onclick=()=>{editRecIdx=null;render();};
  const undoDel=$("#undoDel");
  if(undoDel) undoDel.onclick=()=>{
    if(!lastDel)return;
    const y=lastDel.y, e=lastDel.e;
    save("ds_save_"+y, +( (load("ds_save_"+y,0)+e.delta).toFixed(2) ));
    const log=load("ds_save_log",[]); log.push({ym:y,delta:e.delta,alloc:{},d:e.d||stamp()}); save("ds_save_log",log);

    alert("已撤销删除，¥"+e.delta+" 恢复，心愿池自动更新。"); };
  document.querySelectorAll("[data-recdel]").forEach(btn=>btn.onclick=()=>{

  const saveRec=$("#saveRec");

  document.querySelectorAll("[data-wdel]").forEach(btn=>btn.onclick=()=>{

    const el=$("#allocSum"); if(!el)return;
    el.textContent = sum===0?"当前：未设置比例，将平均分配":sum===100?"合计 100% ✅":`合计 ${sum}%，记一笔时按比例折算`;

  document.querySelectorAll("[data-arole]").forEach(sel=>sel.onchange=()=>{

    allocs[id]=p; save("ds_save_alloc_"+y2,allocs); render(); });
  document.querySelectorAll("[data-apct]").forEach(inp=>inp.onchange=()=>{

    let p=parseFloat(inp.value)||0;

    else { p=Math.max(0,Math.min(30,p)); inp.value=p; }

  const expBtn=$("#expBtn");

      catch(err){ alert("文件格式不对，请选择导出的备份json文件"); } };
    r.readAsText(f); };
}

(async function preloadData(){ // 自动预载备份：只填空白设备/取各月最大值，绝不覆盖已有数据
  if(location.protocol.indexOf("http")!==0) return;
  try{
    const res=await fetch("./preload-backup.json",{cache:"no-store"}); if(!res.ok)return;
    const data=await res.json(); let filled=0;
    for(const k in data){
      const v=data[k];
      if(/^ds_save_\d{4}-\d{2}$/.test(k)){
        if((parseFloat(localStorage.getItem(k))||0)<(parseFloat(v)||0)){ localStorage.setItem(k,String(parseFloat(v)||0)); filled++; }
      } else if(localStorage.getItem(k)===null){ localStorage.setItem(k,v); filled++; }
    }
    if(filled) render();
  }catch(err){}
})();
