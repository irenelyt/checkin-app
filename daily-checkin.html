function expectedW(n){ let w = baseW(n);
  for(const [s,e] of PERIODS){ if(n>=s&&n<=e) w += 1.3*Math.sin(Math.PI*(n-s)/(e-s)); }
  w += 0.35*Math.sin(n*2.3) + 0.22*Math.sin(n*0.9+1.3); /*鏃ュ父姘村垎/杩愬姩鍚庤倢鑲夊偍姘村皬娉㈠姩*/
  return w; }

// ---------- photo compress ----------
function compress(file,cb){ const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    const c=document.createElement("canvas");const mx=200;let w=img.width,h=img.height;
    if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}
    c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    cb(c.toDataURL("image/jpeg",.5));};img.src=e.target.result;};
  r.readAsDataURL(file); }

function prevYm(s){ const p=s.split("-").map(Number); const d=new Date(p[0],p[1]-2,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function carryIn(y){ let carry=0, m=prevYm(y); // 涓婃湀鏀掕秴閮ㄥ垎閾惧紡婊氬叆
  for(let i=0;i<36;i++){ const a=load("ds_save_"+m,null); if(a==null) break;
    const t=load("ds_save_target_"+m,1500); const over=Math.max(0,a+carry-t);
    if(over<=0) break; carry=+over.toFixed(2); m=prevYm(m); }

function computePool(){ let total=0; // 鎵€鏈夋湀浠借褰曠殑閽辨€诲拰 = 蹇冩効姹?  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k&&/^ds_save_\d{4}-\d{2}$/.test(k)){ const v=parseFloat(localStorage.getItem(k)); if(v>0) total+=v; } }
  return +total.toFixed(2); }
function computeAlloc(wishes, allocMap){ // 蹇冩効姹犺嚜鍔ㄥ垎閰嶏細鎸夋瘮渚嬶紙鎴栧钩鍧囷級锛屾弧棰濋『寤讹紝宸茶喘蹇冩効鐨勯挶瑙嗕负宸茶姳鎺?  const total=computePool();
  const doneSpent=wishes.filter(w=>w.done).reduce((s,w)=>s+w.price,0);
  const pool=Math.max(0,+(total-doneSpent).toFixed(2));
  const undone=wishes.filter(w=>!w.done);
  const result={};
  const give=(w,amt)=>{ const space=Math.max(0,+(w.price-(result[w.id]||0)).toFixed(2)); const g=+Math.min(amt,space).toFixed(2);
    if(g>0.004) result[w.id]=+((result[w.id]||0)+g).toFixed(2); return +(amt-g).toFixed(2); };
  const psum=undone.reduce((s,w)=>s+(allocMap[w.id]||0),0);
  let remain=pool;
  if(psum>0){ undone.forEach(w=>{ const p=allocMap[w.id]||0; if(p>0) remain=give(w, pool*p/psum); }); }
  else if(undone.length){ undone.forEach(w=>{ give(w, pool/undone.length); }); }
  let rest=undone.filter(w=>+(w.price-(result[w.id]||0)).toFixed(2)>0.01);
  for(let i=0;i<10&&remain>0.01&&rest.length;i++){
    const each=remain/rest.length; let spent=0;
    rest.forEach(w=>{ const g=give(w,each); spent=+(spent+g).toFixed(2); });
    remain=+(remain-spent).toFixed(2);
    rest=rest.filter(w=>+(w.price-(result[w.id]||0)).toFixed(2)>0.01);
  }
  return {result,total,pool,remain};
}

function drawChart(){
  const cv=$("#chart"); if(!cv)return; const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height,padL=38,padB=26,padT=14,padR=10;
  ctx.clearRect(0,0,W,H);
  const ws=[]; for(let i=0;i<=totalDays;i++){const s=dateOf(i+1),v=load(gtk(s),null);if(v!=null)ws.push({n:i+1,w:v});}
  const lo=Math.min(TARGET_W,...ws.map(x=>x.w))-2, hi=Math.max(START_W,...ws.map(x=>x.w))+2;
  const X=n=>padL+(W-padL-padR)*(n-1)/(totalDays-1);
  const Y=w=>padT+(H-padT-padB)*(hi-w)/(hi-lo);
  ctx.strokeStyle="#e8ecf0";ctx.fillStyle="#8a97a5";ctx.font="11px sans-serif";ctx.textAlign="right";
  for(let w=Math.ceil(lo/5)*5;w<=hi;w+=5){ctx.beginPath();ctx.moveTo(padL,Y(w));ctx.lineTo(W-padR,Y(w));ctx.stroke();ctx.fillText(w,padL-6,Y(w)+4);}
  // 濮ㄥ鏈熼槾褰卞尯
  ctx.fillStyle="rgba(255,122,160,.12)";
  for(const [s,e] of PERIODS){ ctx.fillRect(X(Math.max(1,s)),padT,X(Math.min(totalDays,e))-X(Math.max(1,s)),H-padT-padB); }
  // 鐩爣鐩寸嚎
  ctx.strokeStyle="#ffd8c2";ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(X(1),Y(START_W));ctx.lineTo(X(totalDays),Y(TARGET_W));ctx.stroke();ctx.setLineDash([]);
  // 棰勬湡娉㈠姩鏇茬嚎锛堝惈濮ㄥ鏈熸按鑲胯捣浼忥級
  ctx.strokeStyle="#ff9a5c";ctx.lineWidth=1.5;ctx.beginPath();
  for(let n2=1;n2<=totalDays;n2++){const p=X(n2),q=Y(expectedW(n2));n2===1?ctx.moveTo(p,q):ctx.lineTo(p,q);}
  ctx.stroke();
  ctx.fillStyle="#ff9a5c";ctx.textAlign="left";ctx.fillText("鐩爣鏇茬嚎",X(totalDays)-64,Y(TARGET_W)-6);
  ctx.fillText("棰勬湡娉㈠姩锛堝惈骞冲彴鏈?杩愬姩鍌ㄦ按/濮ㄥ鏈熺矇鑹插尯锛?,padL+6,Y(START_W)-4);
  // actual
  if(ws.length>0){ctx.strokeStyle="#2f9e8f";ctx.lineWidth=2.5;ctx.beginPath();
    ws.forEach((p,i)=>i?ctx.lineTo(X(p.n),Y(p.w)):ctx.moveTo(X(p.n),Y(p.w)));ctx.stroke();
    ctx.fillStyle="#2f9e8f";ws.forEach(p=>{ctx.beginPath();ctx.arc(X(p.n),Y(p.w),3.5,0,7);ctx.fill();});}
  ctx.fillStyle="#8a97a5";ctx.textAlign="center";
  ctx.fillText("11/16",X(1),H-8);ctx.fillText("3/1",X(totalDays),H-8);
}

function renderQR(){

  try{
    if(typeof qrcode!=="undefined"){
      const qr=qrcode(0,"M"); qr.addData(AUDIO_URL); qr.make();
      el.innerHTML=qr.createSvgTag({cellSize:3,margin:6});

  }catch(e){fallback();}

    const diff=+(v2-t.e.delta).toFixed(2);

    alert("宸叉敼涓?楼"+v2+"锛佸績鎰挎睜鑷姩鏇存柊瀹屾瘯銆?); };
  if(reCancel) reCancel.onclick=()=>{editRecIdx=null;render();};
  const undoDel=$("#undoDel");
  if(undoDel) undoDel.onclick=()=>{

    const log=load("ds_save_log",[]); log.push({ym:y,delta:e.delta,alloc:{},d:e.d||stamp()}); save("ds_save_log",log);

    log.splice(target.i,1); save("ds_save_log",log); render(); });
  const saveRec=$("#saveRec");

    const y=saveMonth(), wishes=load("ds_wish",[]);

    save("ds_save_"+y, +( (load("ds_save_"+y,0)+v).toFixed(2) ));
    $("#saveAmt").value="";
    const log=load("ds_save_log",[]); log.push({ym:y,delta:v,alloc:{},d:stamp()}); save("ds_save_log",log);
    alert("宸茶涓€绗?楼"+v+"锛佸績鎰挎睜宸茶嚜鍔ㄦ寜姣斾緥鍒嗛厤銆?);
    render(); };
  const wishAdd=$("#wishAdd");

    const name=$("#wishName").value.trim(), price=parseFloat($("#wishPrice").value);

    save("ds_wish",wishes); render(); };

  if(wishTpl) wishTpl.onclick=()=>{
    const wishes=load("ds_wish",[]); let added=0;
    WISH_TPL.forEach(([n,p])=>{ if(!wishes.some(w=>w.name===n)){ wishes.push({id:Date.now()+Math.random(),name:n,price:p,saved:0,done:false}); added++; } });

    alert(added?("宸叉仮澶?"+added+" 涓ず渚嬪績鎰匡紝鍙偣 鉁忥笍 鏀逛环鏍兼垨 鉁?鍒犻櫎涓嶉渶瑕佺殑銆?):"绀轰緥蹇冩効閮藉凡瀛樺湪锛屾棤闇€鎭㈠銆?);
    render(); };
  document.querySelectorAll("[data-wdel]").forEach(btn=>btn.onclick=()=>{
    const now=Date.now();
    if(delArm!==btn.dataset.wdel || now-delArmTs>3500){
      delArm=btn.dataset.wdel; delArmTs=now;

      return; }
    save("ds_wish",load("ds_wish",[]).filter(x=>String(x.id)!==btn.dataset.wdel)); render(); });
  document.querySelectorAll("[id^=buy_]").forEach(btn=>btn.onclick=()=>{
    const id=btn.id.slice(4); const wishes=load("ds_wish",[]);
    const w=wishes.find(x=>String(x.id)===id); if(w){w.done=true;w.doneDate=cur;save("ds_wish",wishes);render();} });
  const updateAllocSum=()=>{
    const els=[...document.querySelectorAll("[data-apct]")];
    const sum=els.length?els.reduce((s,e2)=>s+(parseFloat(e2.value)||0),0):0;
    const el=$("#allocSum"); if(!el)return;
    el.textContent = sum===0?"褰撳墠锛氭湭璁剧疆姣斾緥锛屽皢骞冲潎鍒嗛厤":sum===100?"鍚堣 100% 鉁?:`鍚堣 ${sum}%锛岃涓€绗旀椂鎸夋瘮渚嬫姌绠梎;
    el.style.color = sum===100?"var(--ok)":sum===0?"var(--sub)":"#c2620a"; };
  document.querySelectorAll("[data-arole]").forEach(sel=>sel.onchange=()=>{
    const y2=saveMonth(); const id=sel.dataset.arole;
    const roles=load("ds_save_role_"+y2,{}); roles[id]=sel.value; save("ds_save_role_"+y2,roles);
    const allocs=load("ds_save_alloc_"+y2,{}); let p=allocs[id]||0;
    if(sel.value==="big"){ if(![50,80,100].includes(p)) p=50; }
    else { if(p>30) p=10; }
    allocs[id]=p; save("ds_save_alloc_"+y2,allocs); render(); });
  document.querySelectorAll("[data-apct]").forEach(inp=>inp.onchange=()=>{
    const y2=saveMonth(); const id=inp.dataset.apct;
    const roles=load("ds_save_role_"+y2,{}); const role=roles[id]||"small";
    let p=parseFloat(inp.value)||0;
    if(role==="big"){ if(![50,80,100].includes(p)) p=50; inp.value=p; }
    else { p=Math.max(0,Math.min(30,p)); inp.value=p; }
    const allocs=load("ds_save_alloc_"+y2,{}); allocs[id]=p; save("ds_save_alloc_"+y2,allocs);
    render(); });
  const wsave=$("#wsave");
  if(wsave) wsave.onclick=()=>{const v=parseFloat($("#win").value);
    if(!v||v<60||v>300){alert("璇疯緭鍏ュ悎鐞嗙殑浣撻噸锛堟枻锛?);return;}
    save(gtk(cur),v);render();};
  // ---- 澶囦唤涓庢仮澶?----
  const wToggle=$("#wToggle");
  if(wToggle) wToggle.onclick=()=>{ weightHidden=!weightHidden; save("ds_whidden",weightHidden); render(); };
  const expBtn=$("#expBtn");
  if(expBtn) expBtn.onclick=()=>{
    const out={};
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
      if(k&&k.indexOf("ds_")===0) out[k]=localStorage.getItem(k); }

    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="鎵撳崱鍙板浠絖"+fmt(new Date())+".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000); };
  const impFile=$("#impFile");
  if(impFile) impFile.onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{ try{ const obj=JSON.parse(ev.target.result); let n=0;
        for(const k in obj){ if(k.indexOf("ds_")===0){ localStorage.setItem(k,obj[k]); n++; } }
        alert("宸插鍏?"+n+" 椤规暟鎹?鉁?); render(); }
      catch(err){ alert("鏂囦欢鏍煎紡涓嶅锛岃閫夋嫨瀵煎嚭鐨勫浠絡son鏂囦欢"); } };
    r.readAsText(f); };
}

render();

(async function preloadData(){ // 鑷姩棰勮浇澶囦唤锛氬彧濉┖鐧借澶?鍙栧悇鏈堟渶澶у€硷紝缁濅笉瑕嗙洊宸叉湁鏁版嵁
  if(location.protocol.indexOf("http")!==0) return;
  try{
    const res=await fetch("./preload-backup.json",{cache:"no-store"}); if(!res.ok)return;
    const data=await res.json(); let filled=0;
    for(const k in data){
      const v=data[k];
      if(/^ds_save_\d{4}-\d{2}$/.test(k)){
        if((parseFloat(localStorage.getItem(k))||0)<(parseFloat(v)||0)){ localStorage.setItem(k,String(parseFloat(v)||0)); filled++; }
      } else if(localStorage.getItem(k)===null){ localStorage.setItem(k,v); filled++; }
    }
    if(filled) render();
  }catch(err){}
})();
